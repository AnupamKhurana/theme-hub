<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="modern-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e2e" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>
    <linearGradient id="modern-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="modern-violet-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer subtle circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#modern-grad-bg)" stroke="url(#modern-cyan-violet)" stroke-width="1.8" stroke-opacity="0.75" />

  <!-- Aesthetic 4-Module Geometric Grid -->
  <g filter="url(#neon-glow)">
    <!-- Top Left Module -->
    <rect x="15" y="15" width="14" height="14" rx="4.5" fill="url(#modern-cyan-violet)" />
    
    <!-- Top Right Module -->
    <rect x="35" y="15" width="14" height="14" rx="4.5" fill="url(#modern-cyan-violet)" fill-opacity="0.85" />
    
    <!-- Bottom Left Module -->
    <rect x="15" y="35" width="14" height="14" rx="4.5" fill="url(#modern-violet-pink)" fill-opacity="0.85" />
    
    <!-- Bottom Right Module -->
    <rect x="35" y="35" width="14" height="14" rx="4.5" fill="url(#modern-violet-pink)" />

    <!-- Center aesthetic core spark -->
    <circle cx="32" cy="32" r="2.8" fill="#ffffff" />
  </g>
</svg>
