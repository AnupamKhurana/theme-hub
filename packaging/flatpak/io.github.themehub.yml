app-id: io.github.themehub
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: theme-hub

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --talk-name=org.kde.plasmashell
  - --talk-name=org.kde.KWin
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: theme-hub
    buildsystem: simple
    build-commands:
      - ./install.sh --system --destdir=/app
    sources:
      - type: dir
        path: ../..
